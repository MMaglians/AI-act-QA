[project]
name = "ai-act-qa"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Matteo Magliano", email = "perfiu02@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "faiss-cpu>=1.15.1",
    "google-genai>=2.32.0",
    "llama-index-core>=0.14.25",
    "llama-index-llms-google-genai>=0.11.3",
    "llama-index-vector-stores-faiss>=0.7.0",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
]



[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
